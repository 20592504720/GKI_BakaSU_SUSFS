name: 更新 GKI 版本数据

# 适配 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 8 * * 1'  # 每周一 UTC 8:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gki-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 检查数据同步逻辑
        run: python -m unittest discover -s tests -p 'test_update_data.py'

      - name: 增量更新并校验数据
        run: python scripts/update_data.py

      - name: 验证全部构建矩阵
        run: |
          for data_file in data/android*/*.json; do
            python scripts/prepare_matrix.py "$data_file" > /dev/null
          done

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/android*/*.json
          if git diff --cached --quiet; then
            echo "GKI 版本数据没有变化。"
            exit 0
          fi
          git commit -m "chore: update GKI kernel version data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
