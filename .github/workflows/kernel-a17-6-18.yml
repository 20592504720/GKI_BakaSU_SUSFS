name: Build Kernel - Android 17 (6.18)

# 适配 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # KernelSU 变体固定为 BakaSU
      kernelsu_branch:
        description: "BakaSU branch (main/builtin/custom commit hash; leave blank to use the default)"
        required: false
        type: string
        default: ""
      clean_build:
        description: "Clean build (without KernelSU, SUSFS, or optional patches)"
        required: false
        type: boolean
        default: false
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (optional; enter N or leave blank to use the current UTC time)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        description: "Enable enhanced ZRAM algorithms"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable the BBG anti-brick patch"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel drivers"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply the CVE-2026-43499 rtmutex patch series"
        required: false
        type: boolean
        default: true
      cancel_susfs:
        description: "Disable SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus 8E support"
        required: false
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces container support"
        required: false
        type: choice
        options:
          - "off"
          - "on"
        default: "off"
      droidspaces_ntsync:
        description: "Enable NTSync support for Droidspaces containers (requires Droidspaces to be enabled)"
        required: false
        type: boolean
        default: false
      build_bypass:
        description: "Build both standard and Bypass kernels"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "Enable NoMount mount support (requires the companion module)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      clean_build:
        required: false
        type: boolean
        default: false
      # KernelSU 变体固定为 BakaSU
      kernelsu_branch:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: true
      cancel_susfs:
        required: false
        type: boolean
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      build_bypass:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false

jobs:
  prepare-matrix:
    uses: ./.github/workflows/prepare-matrix.yml
    with:
      data_file: data/android17/6.18.json
      deduplicate_sublevels: true

  build-kernels-a17-6-18:
    needs: prepare-matrix
    name: "${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs['prepare-matrix'].outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision || '' }}
      ksu_variant: ${{ inputs.clean_build && 'Clean' || 'BakaSU' }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: false
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      build_bypass: ${{ inputs.build_bypass || false }}
